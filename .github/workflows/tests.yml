name: tests

on:
  push:
  pull_request:

jobs:
  test:
    # Windows runner: the project imports winreg and keyboard, which are
    # Windows-only. Dummy API keys are supplied by tests/conftest.py.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: pytest -v
